<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>That's MINE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #d0d0d0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding: 32px;
    }

    .contact-btn {
      display: inline-block;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 4.5px;
      color: #434343;
      cursor: pointer;
      margin-bottom: 40px;
      background: none;
      border: none;
    }
    .contact-btn:hover { opacity: 0.7; }

    .grid {
      display: grid;
      position: content;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 24px;
    }

    .folder-card {
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.15s;
      overflow: hidden;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .folder-card:hover { transform: scale(1.05); }

    .folder-tab {
      height: 30px;
      width: 40%;
      border-radius: 10px 10px 0 0;
      margin-bottom: -4px;
    }

    .folder-body {
      flex: 1.25;
      border-radius: 0 16px 16px 16px;
      display: flex;
      align-items: flex-end;
      padding: 16px 18px;
    }

    .folder-label {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 2.5px;
    }

    .f-poster  .folder-tab, .f-poster  .folder-body { background: #ffd5bb; }
    .f-poster  .folder-label { color: #673a24; }

    .f-website .folder-tab, .f-website .folder-body { background: #dbbaff; }
    .f-website .folder-label { color: #383838; }

    .f-package .folder-tab, .f-package .folder-body { background: #003322; }
    .f-package .folder-label { color: #33cc88; }

    .f-ppt     .folder-tab, .f-ppt     .folder-body { background: #3a0000; }
    .f-ppt     .folder-label { color: #ff6666; }

    .f-bi      .folder-tab, .f-bi      .folder-body { background: #2a1a00; }
    .f-bi      .folder-label { color: #ffaa00; }

    .f-video   .folder-tab, .f-video   .folder-body { background: #001a33; }
    .f-video   .folder-label { color: #00ccff; }

    /* 오버레이 */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.active { display: flex; }

    /* 팝업 */
    .popup {
      background: #e4e4e4;
      border-radius: 10px;
      min-width: 340px;
      max-width: 500px;
      width: 90%;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .popup-titlebar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #6a6a6a;
      padding: 9px 14px;
    }

    .popup-close-btn {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #e84040;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .popup-title-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
    }

    .popup-body {
      padding: 24px 28px;
    }

    .popup-item {
      display: flex;
      align-items: center;
      padding: 10px 8px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
      font-size: 14px;
      color: #333;
      border-radius: 4px;
      transition: background 0.1s;
    }
    .popup-item:last-child { border-bottom: none; }
    .popup-item:hover { background: #d4d4d4; }

    .popup-item .name { flex: 1; }
    .popup-item .ext  { color: #888; font-size: 13px; min-width: 38px; text-align: right; }

    .contact-info p {
      margin: 10px 0;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>

  <button class="contact-btn" onclick="openContact()">CONTACT</button>

  <div class="grid">
    <div class="folder-card f-poster"  onclick="openFolder('POSTER')">
      <div class="folder-tab"></div>
      <div class="folder-body"><span class="folder-label">POSTER</span></div>
    </div>
    <div class="folder-card f-website" onclick="openFolder('WEBSITE')">
      <div class="folder-tab"></div>
      <div class="folder-body"><span class="folder-label">WEBSITE</span></div>
    </div>
    <div class="folder-card f-package" onclick="openFolder('PACKAGE')">
      <div class="folder-tab"></div>
      <div class="folder-body"><span class="folder-label">PACKAGE</span></div>
    </div>
    <div class="folder-card f-ppt"     onclick="openFolder('PPT')">
      <div class="folder-tab"></div>
      <div class="folder-body"><span class="folder-label">PPT</span></div>
    </div>
    <div class="folder-card f-bi"      onclick="openFolder('BI')">
      <div class="folder-tab"></div>
      <div class="folder-body"><span class="folder-label">BI</span></div>
    </div>
    <div class="folder-card f-video"   onclick="openFolder('VIDEO')">
      <div class="folder-tab"></div>
      <div class="folder-body"><span class="folder-label">VIDEO</span></div>
    </div>
  </div>

  <!-- 팝업 -->
  <div class="overlay" id="overlay">
    <div class="popup" id="popup">
      <div class="popup-titlebar">
        <button class="popup-close-btn" onclick="closePopup()">✕</button>
        <span class="popup-title-text" id="popup-title"></span>
      </div>
      <div class="popup-body" id="popup-body"></div>
    </div>
  </div>

  <!-- 두 번째 팝업 -->
<div class="overlay" id="overlay2">
  <div class="popup" id="popup2">
    <div class="popup-titlebar">
      <button class="popup-close-btn" onclick="closePopup2()">✕</button>
      <span class="popup-title-text" id="popup2-title"></span>
    </div>
    <div class="popup-body" id="popup2-body"></div>
  </div>
</div>

  <script>
    const folderData = {
      POSTER: [
        { name: '외국인 관광객을 대상으로 한 한국 홍보 포스터', ext: '.ai' }
      ],
      WEBSITE: [
        { name: '[CASAMIA] 웹사이트 리디자인', ext: 'WEBSITE/CASAMIA Website redesign.html' },
        { name: 'COVER LETTER', ext: '.ai' },
        { name: 'PORTFOLIO', ext: '.ai' }
      ],
      PACKAGE: [
        { name: '커피 패키지 디자인', ext: '.ai' },
        { name: '초콜렛 패키지 디자인', ext: '.ai' }
      ],
      PPT: [
        { name: '웹사이트 리디자인 기획', ext: '.pptx' },
        { name: '웹사이트 리디자인 시안', ext: '.pptx' },
        { name: '커피 패키지 기획', ext: '.pptx' },
        { name: '초콜렛 패키지 기획', ext: '.pptx' },
        { name: '졸업작품 기획', ext: '.pptx' },
        { name: '졸업작품 진행사항', ext: '.pptx' },
        { name: '매체 조사', ext: '.pptx' },
        { name: '기획안', ext: '.pptx' }
      ],
      BI: [
        { name: '[YOUNGGAGU] BI 리디자인', ext: '.png' }
      ],
      VIDEO: [
        { name: '자유주제 1', ext: '.mp4' },
        { name: '사진 편집', ext: '.mp4' },
        { name: '[DESIGN] antique&amp;vintage', ext: '.mp4' },
        { name: '자유주제 2', ext: '.mp4' }
      ]
    };

    function openFolder(name) {
      const items = folderData[name];
      document.getElementById('popup-title').textContent = name;
      document.getElementById('popup-body').innerHTML = items.map(i =>
        `<div class="popup-item">
          <span class="name">${i.name}</span>
          <span class="ext">${i.ext}</span>
        </div>`
      ).join('');
      document.getElementById('overlay').classList.add('active');
    }

    function openContact() {
      document.getElementById('popup-title').textContent = 'CONTACT';
      document.getElementById('popup-body').innerHTML = `
        <div class="contact-info">
          <p>Phone : 010-6237-1396</p>
          <p>E-mail : choiseoyoung00@gmail.com</p>
          <p>Instagram : @novah4313</p>
        </div>`;
      document.getElementById('overlay').classList.add('active');
    }

    function closePopup() {
      document.getElementById('overlay').classList.remove('active');
    }

    function openSubPopup(name, ext) {
  document.getElementById('popup2-title').textContent = name;
  document.getElementById('popup2-body').innerHTML = `
    <p style="font-size:14px; color:#333;">
      파일명: ${name}${ext}
    </p>`;
  document.getElementById('overlay2').classList.add('active');
}

function closePopup2() {
  document.getElementById('overlay2').classList.remove('active');
}
</script>

</body>
</html>
