<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>That's MINE</title>
</head>

<style>
     body {
        background-color: #f5f5f5;
        color: #333;
        font-family: Arial, sans-serif;
    }
    .btns {
        display: inline-flex;
        padding: 20px 20px;
        background-color: #007BFF;
        color: #fff;
        cursor: pointer;
        border-radius: 5px;
        margin: 20px;
    }

    .popup-close {
        position: absolute;
        top: 10px; right: 15px;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
    }

    /* 폴더 아이템 hover 효과 */
    .folder-item {
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        transition: background 0.2s;
    }
    .folder-item:hover {
        background-color: #e0e0e0;
    }

    /* 팝업 오버레이 */
    .popup-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 999;
    }

    /* 팝업 박스 */
    .popup-box {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        padding: 40px;
        border-radius: 10px;
        z-index: 1000;
        min-width: 300px;
        text-align: center;
    }
    
</style>

<body>
    <div class="btns" onclick="openPopup('CONTACT')">CONTACT</div>
    
    <div class="popup-overlay" id="popupOverlay" onclick="closePopup()"></div>
    <div class="popup-box" id="popupBox">
        <span class="popup-close" onclick="closePopup()">✕</span>
        <div id="popup-content"></div>
    </div>

    <div class="folder-grid">
        <div class="folder-folder__POSTER">
            <div class="folder-folder__title">POSTER</div>
            <p class="folder-item" onclick="openPopup('외국인 관광객을 대상으로 한 한국 홍보 포스터')">외국인 관광객을 대상으로 한 한국 홍보 포스터</p>
        </div>
    </div>

    <div class="folder-grid">
        <div class="folder-folder__WEBSITE">
            <div class="folder-folder__title">WEBSITE</div>
            <p class="folder-item" onclick="openPopup('[CASAMIA] 웹사이트 리디자인')">[CASAMIA] 웹사이트 리디자인</p>
            <p class="folder-item" onclick="openPopup('COVER LETTER')">COVER LETTER</p>
            <p class="folder-item" onclick="openPopup('PORTFOLIO')">PORTFOLIO</p>
        </div>
    </div>

    <div class="folder-grid">
        <div class="folder-folder__PACKAGE">
            <div class="folder-folder__title">PACKAGE</div>
            <p class="folder-item" onclick="openPopup('커피 패키지 디자인')">커피 패키지 디자인</p>
            <p class="folder-item" onclick="openPopup('초콜렛 패키지 디자인')">초콜렛 패키지 디자인</p>
        </div>
    </div>

    <div class="folder-grid">
        <div class="folder-folder__BI">
            <div class="folder-folder__title">BI</div>
            <p class="folder-item" onclick="openPopup('[YOUNGGAGU] BI 리디자인')">[YOUNGGAGU] BI 리디자인</p>
        </div>
    </div>

    <div class="folder-grid">
        <div class="folder-folder__VIDEO">
            <div class="folder-folder__title">VIDEO</div>
            <p class="folder-item" onclick="openPopup('자유주제 1')">자유주제 1</p>
            <p class="folder-item" onclick="openPopup('사진 편집')">사진 편집</p>
            <p class="folder-item" onclick="openPopup('[DESIGN] antique&vintage')">[DESIGN] antique&vintage</p>
            <p class="folder-item" onclick="openPopup('자유주제 2')">자유주제 2</p>
        </div>
    </div>

    <script>
        // CONTACT 팝업 내용 별도 정의
        const contactHTML = `
            <p>Phone : 010-6237-1396</p>
            <p>E-mail : choiseoyoung00@gmail.com</p>
            <p>Instagram : @novah4313</p>
        `;

        function openPopup(text) {
            const content = document.getElementById('popup-content');

            if (text === 'CONTACT') {
                content.innerHTML = contactHTML;
            } else {
                content.innerHTML = `<p>${text}</p>`;
            }

            document.getElementById('popupOverlay').style.display = 'block';
            document.getElementById('popupBox').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
            document.getElementById('popupBox').style.display = 'none';
        }
    </script>

</body>
</html>
